<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --surface-2:#F6F7F4; --ink:#1C2426; --muted:#5D686A; --line:#D6DAD4;
  --kraft:#A8733A; --kraft-soft:#F1E3D0; --kraft-ink:#6E4719;
  --k1:#E0B173; --k2:#B98241; --k3:#8E5E2C; --tape:#1F3A68; --brandfont:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --navy:#1F3A68; --link:#285C8C; --low:#B4462F; --low-soft:#F7E1DB; --ok:#2F7A4F;
  --shadow:0 1px 2px rgba(28,36,38,.06),0 4px 14px rgba(28,36,38,.06);
  --display:"Big Shoulders Stencil Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131719; --surface:#1B2023; --surface-2:#22282B; --ink:#E7EBE8; --muted:#9AA5A6; --line:#30383B;
    --kraft:#D39A5A; --kraft-soft:#3A2B1C; --kraft-ink:#EBC08E;
    --tape:#6F93D4; --navy:#A9C2EC; --link:#7FB2E0; --low:#EE8A73; --low-soft:#3D221C; --ok:#6FC493;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131719; --surface:#1B2023; --surface-2:#22282B; --ink:#E7EBE8; --muted:#9AA5A6; --line:#30383B;
  --kraft:#D39A5A; --kraft-soft:#3A2B1C; --kraft-ink:#EBC08E;
  --tape:#6F93D4; --navy:#A9C2EC; --link:#7FB2E0; --low:#EE8A73; --low-soft:#3D221C; --ok:#6FC493;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:0 16px 48px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
a{color:var(--link)}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:24px}
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{margin:0}
.lockup{display:flex;align-items:center;gap:12px}
.lockup .cube{width:52px;height:56px;flex:none}
.lockup .wm{display:flex;flex-direction:column;line-height:1}
.lockup .org{font:700 11px/1 var(--brandfont);letter-spacing:.32em;color:var(--kraft);margin:0 0 4px 2px}
.lockup .word{font:800 40px/.9 var(--brandfont);letter-spacing:-.03em;color:var(--navy)}
.lockup .tag{font:500 12.5px/1 var(--brandfont);color:var(--muted);margin:6px 0 0 2px;letter-spacing:.01em;white-space:nowrap}
.brand p{margin:0;color:var(--muted);font-size:14px}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.kraft{background:var(--kraft);color:#fff;border-color:var(--kraft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--low)}
.btn.danger.armed{background:var(--low);color:#fff;border-color:var(--low)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}

.searchbar{display:flex;gap:10px;flex-wrap:wrap}
.searchbar input{flex:1 1 260px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}

.stats{display:flex;gap:24px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:18px;margin-right:4px}

.notice{background:var(--kraft-soft);color:var(--kraft-ink);padding:10px 14px;border-radius:8px;font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;box-shadow:var(--shadow)}
.box:hover{border-color:var(--kraft)}
.box .thumb{aspect-ratio:16/9;background:var(--kraft-soft);display:flex;align-items:center;justify-content:center;max-width:100%}
.box .thumb img{width:100%;height:100%;object-fit:cover}
.box .thumb .noimg{font:800 44px/1 var(--display);color:var(--kraft);opacity:.55;letter-spacing:.04em}
.box .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.code{font:700 13px/1 var(--mono);color:var(--kraft-ink);background:var(--kraft-soft);padding:4px 7px;border-radius:4px;align-self:flex-start;letter-spacing:.04em}
.box h3{font-size:16px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.low{background:var(--low-soft);color:var(--low);border-color:transparent}
.pill.ex{background:var(--kraft-soft);color:var(--kraft-ink);border-color:transparent}
.empty{border:2px dashed var(--line);border-radius:12px;padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* results */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .name{font-weight:600}
.item .sub{color:var(--muted);font-size:13px}
.item .actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:32px;height:32px;font-size:18px;line-height:1}
.qty span{min-width:36px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.order{font-weight:600;font-size:13px;text-decoration:none;border:1px solid var(--link);color:var(--link);padding:5px 10px;border-radius:8px;white-space:nowrap}
.order:hover{background:var(--link);color:var(--bg)}
.lowbtn{border:1px solid var(--line);background:transparent;border-radius:8px;font-size:12px;font-weight:600;padding:6px 8px;color:var(--muted)}
.lowbtn[aria-pressed="true"]{background:var(--low-soft);color:var(--low);border-color:transparent}
.boxlink{border:0;background:none;padding:0;color:var(--link);font-weight:600;font-size:13px;text-decoration:underline}
@media (max-width:560px){.item{grid-template-columns:1fr}.item .actions{justify-content:flex-start}}

/* box view */
.back{align-self:flex-start;margin-top:20px}
.boxhead{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.boxhead .bigcode{font:800 56px/0.9 var(--display);color:var(--kraft);letter-spacing:.03em}
.boxhead h2{font-size:24px;font-weight:700;margin-top:6px}
.boxhead .desc{color:var(--muted);max-width:60ch;margin:6px 0 0}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
section.card > .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
section.card h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.photos{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.ph{position:relative;flex:0 0 auto;width:180px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:6px;font-size:12px;padding:3px 7px}
.ph .x.armed{background:var(--low)}
.addform{display:grid;grid-template-columns:2fr 90px 1.4fr auto;gap:8px}
.addform input{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;min-width:0}
@media (max-width:640px){.addform{grid-template-columns:80px 1fr}.addform .full,.addform button{grid-column:1/-1}}
.ai{border:1px solid var(--kraft);background:var(--kraft-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ai label{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ai label input[type=number]{width:60px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface)}
.ai .status{color:var(--kraft-ink);font-size:14px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,14,15,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
@media (min-width:640px){.overlay{align-items:center}}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;width:100%}
.field .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.sheet .foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.viewer{background:transparent;max-width:1100px;padding:0;align-items:center}
.viewer img{max-height:80vh;border-radius:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.box{transition:border-color .15s}}

html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* ---------- login ---------- */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:32px;max-width:400px;margin:0 auto;text-align:center}
.stage{position:relative;width:280px;height:92px;flex:none}
.stage .logo{position:absolute;left:0;right:0;top:0;z-index:1;display:flex;justify-content:center}
.stage .logo .cube{width:60px;height:65px}
.stage .logo .word{font-size:52px}
.stage .logo .tag{font-size:15px;margin-top:7px}
.logincard{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;text-align:left;box-shadow:var(--shadow)}
.logincard p{margin:0}
.logincard .field input{font-size:17px;padding:12px 14px}
.logincard .btn{width:100%;justify-content:center;min-height:48px;font-size:16px}
.logincard .fine{color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .play .logo{animation:logoDrop 1s linear .15s both}
  .play #gateBody{animation:fadeUp .5s ease-out 1.2s both}
}
@keyframes logoDrop{0%{transform:translateY(-60vh);opacity:0;animation-timing-function:cubic-bezier(.55,0,1,.45)}8%{opacity:1}55%{transform:none;animation-timing-function:cubic-bezier(0,.55,.45,1)}72%{transform:translateY(-18px);animation-timing-function:cubic-bezier(.55,0,1,.45)}86%{transform:none;animation-timing-function:cubic-bezier(0,.55,.45,1)}93%{transform:translateY(-5px);animation-timing-function:cubic-bezier(.55,0,1,.45)}100%{transform:none;opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code{font-family:var(--mono);font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="login play" id="gate">
  <div class="stage" aria-hidden="true">
    <div class="logo lockup"><svg class="cube" viewBox="0 0 100 108" aria-hidden="true"><polygon points="50,6 94,28 50,50 6,28" fill="var(--k1)"/><polygon points="6,28 50,50 50,102 6,80" fill="var(--k2)"/><polygon points="50,50 94,28 94,80 50,102" fill="var(--k3)"/><polygon points="24,19 34,14 76,35 66,40" fill="var(--tape)"/><polygon points="66,40 76,35 76,50 66,55" fill="var(--tape)" opacity=".85"/></svg><span class="wm"><span class="org">WGBC</span><span class="word">storit</span><span class="tag">One box at a time</span></span></div>
  </div>
  <h1 class="sr-only">WGBC Storit</h1>
  <div id="gateBody"><div class="logincard"><p class="fine">Loading…</p></div></div>
</div>
<div class="wrap" id="app" hidden>
  <!-- HOME -->
  <div id="home" style="display:flex;flex-direction:column;gap:20px">
    <header class="top">
      <div class="brand">
        <h1 class="lockup" aria-label="WGBC Storit"><svg class="cube" viewBox="0 0 100 108" aria-hidden="true"><polygon points="50,6 94,28 50,50 6,28" fill="var(--k1)"/><polygon points="6,28 50,50 50,102 6,80" fill="var(--k2)"/><polygon points="50,50 94,28 94,80 50,102" fill="var(--k3)"/><polygon points="24,19 34,14 76,35 66,40" fill="var(--tape)"/><polygon points="66,40 76,35 76,50 66,55" fill="var(--tape)" opacity=".85"/></svg><span class="wm"><span class="org">WGBC</span><span class="word">storit</span><span class="tag">One box at a time</span></span></h1>
      </div>
      <div class="row"><button class="btn" id="settingsBtn" hidden>Settings</button><button class="btn kraft" id="newBoxBtn">+ New box</button></div>
    </header>
        <div class="searchbar">
      <input id="q" type="search" placeholder="Find anything: “Christmas lights”, “extension cord”, “Shelf B”…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
    <div class="stats" id="stats"></div>
    <div id="homeBody"></div>
  </div>

  <!-- BOX -->
  <div id="boxView" hidden style="display:flex;flex-direction:column;gap:18px">
    <button class="btn ghost back" id="backBtn">← All boxes</button>
    <div class="boxhead" id="boxHead"></div>

    <section class="card">
      <div class="hd">
        <h3>Photos of contents</h3>
        <div class="row">
          <label class="btn sm" id="addPhotoLbl">+ Add photo<input type="file" id="photoInput" accept="image/*" multiple hidden></label>
        </div>
      </div>
      <div class="photos" id="photos"></div>
    </section>

    <section class="card">
      <div class="hd"><h3 id="itemsTitle">Items</h3></div>
      <form class="addform" id="addItemForm" autocomplete="off">
        <input id="newName" class="full" placeholder="Item name (e.g. Folding table, 6 ft)" required>
        <input id="newQty" type="number" min="0" value="1" aria-label="Quantity">
        <input id="newLink" placeholder="Order link (optional)">
        <button class="btn primary" type="submit">Add</button>
      </form>
      <div id="items"></div>
    </section>
  </div>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<datalist id="catList">
  <option>Christmas</option><option>Easter</option><option>VBS</option><option>Kids ministry</option>
  <option>Youth</option><option>Worship &amp; music</option><option>AV &amp; tech</option><option>Kitchen &amp; fellowship</option>
  <option>Décor</option><option>Office supplies</option><option>Cleaning</option><option>Outreach</option><option>Other</option>
</datalist>
<datalist id="locList"></datalist>
<script type="module">
// ================================================================
//  PASTE YOUR FIREBASE CONFIG HERE (Firebase console → Project settings → Your apps → Web app)
// ================================================================
const firebaseConfig = {
  apiKey: "AIzaSyBcYyUQetIGe8PewuVJE5tIuXJJqzRictE",
  authDomain: "wgbc-storit.firebaseapp.com",
  projectId: "wgbc-storit",
  appId: "1:339711135664:web:6ebb32cd6907edba625075",
};
// ================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, getDoc, setDoc, deleteDoc, onSnapshot, writeBatch,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// ---------- firebase ----------
const configured = !String(firebaseConfig.apiKey).startsWith("PASTE");
let fb = null, auth = null, db = null;
if (configured) {
  fb = initializeApp(firebaseConfig);
  auth = getAuth(fb);
  db = initializeFirestore(fb, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
}

// ---------- state ----------
const S = { boxes: new Map(), items: new Map(), view: "home", boxId: null, q: "", filter: "all", ready: false, me: null, role: null };
const photoData = new Map();   // photoId -> dataURL
const photoLoading = new Set();
let unsubs = [];

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2800);
}
function errMsg(e) {
  const c = e && e.code || "";
  if (c.includes("permission-denied")) return "You don't have permission for that. Ask an admin to add you.";
  if (c.includes("resource-exhausted")) return "The free daily limit was reached. Try again tomorrow.";
  if (c.includes("unavailable")) return "Offline. Your change is saved on this phone and will upload when you're back online.";
  return "Couldn't save that. Check your connection and try again.";
}

// ---------- gate / access code ----------
function showGate(html) { $("#gateBody").innerHTML = `<div class="logincard">${html}</div>`; $("#gate").hidden = false; $("#app").hidden = true; }
function hideGate() { $("#gate").hidden = true; $("#app").hidden = false; }
let myUid = null;

function codeGate(msg) {
  unsubs.forEach(u => u()); unsubs = [];
  const saved = (() => { try { return localStorage.getItem("storit-name") || ""; } catch { return ""; } })();
  showGate(`
    ${msg ? `<p class="notice">${esc(msg)}</p>` : ""}
    <form id="codeForm" style="display:flex;flex-direction:column;gap:14px" autocomplete="off">
      <div class="field"><label for="gLogin">Login</label><input id="gLogin" autocapitalize="characters" autocorrect="off" spellcheck="false" required></div>
      <div class="field"><label for="gCode">Access code</label><input id="gCode" type="password" inputmode="numeric" autocorrect="off" spellcheck="false" required></div>
      <button class="btn primary">Log in</button>
    </form>
    <p class="fine">You only log in once on each phone or computer.</p>`);
  $("#codeForm").addEventListener("submit", async e => {
    e.preventDefault();
    const login = $("#gLogin").value.trim().toUpperCase(), code = $("#gCode").value.trim();
    const name = saved || login;
    const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Checking…";
    try {
      await setDoc(doc(db, "members", myUid), { login, code, name, joinedAt: Date.now() });
      enter(name);
    } catch (err) {
      btn.disabled = false; btn.textContent = "Log in";
      toast(String(err.code).includes("permission") ? "Login or access code isn't right." : errMsg(err));
    }
  });
}

function enter(name) {
  S.me = name || "Volunteer";
  hideGate(); $("#settingsBtn").hidden = false;
  subscribe(); render();
}

if (!configured) {
  showGate(`<p class="fine">Almost there. Paste your Firebase settings into <code>index.html</code> (the block marked <strong>PASTE YOUR FIREBASE CONFIG HERE</strong>), then upload it again.</p>`);
} else {
  onAuthStateChanged(auth, async user => {
    unsubs.forEach(u => u()); unsubs = [];
    S.boxes.clear(); S.items.clear(); S.ready = false;
    if (!user) {
      showGate(`<p class="fine">Connecting…</p>`);
      signInAnonymously(auth).catch(() => showGate(`<p class="fine">Can't connect right now. Check your internet connection and reload the page.</p>`));
      return;
    }
    myUid = user.uid;
    let me = null;
    try { const m = await getDoc(doc(db, "members", myUid)); me = m.exists() ? m.data() : null; } catch { me = null; }
    if (!me) { codeGate(); return; }
    enter(me.name);
  });
}

function subscribe() {
  const onErr = e => {
    if (String(e.code).includes("permission")) codeGate("The access code has changed. Log in again with the new code.");
    else toast(errMsg(e));
  };
  unsubs.push(onSnapshot(collection(db, "boxes"), snap => {
    S.boxes.clear(); snap.forEach(d => S.boxes.set(d.id, { ...d.data(), id: d.id })); S.ready = true; render();
  }, onErr));
  unsubs.push(onSnapshot(collection(db, "items"), snap => {
    S.items.clear(); snap.forEach(d => { if (!pending.has(d.id)) S.items.set(d.id, { ...d.data(), id: d.id }); else S.items.set(d.id, localItems.get(d.id) || { ...d.data(), id: d.id }); }); render();
  }, onErr));
}

// ---------- data layer ----------
const uid = () => doc(collection(db, "boxes")).id;
const strip = o => { const { id, ...rest } = o; return rest; };
async function put(col, id, data) {
  (col === "boxes" ? S.boxes : S.items).set(id, { ...data, id }); render();
  try { await setDoc(doc(db, col, id), data); } catch (e) { toast(errMsg(e)); }
}
async function del(col, id) {
  (col === "boxes" ? S.boxes : S.items).delete(id); render();
  try { await deleteDoc(doc(db, col, id)); } catch (e) { toast(errMsg(e)); }
}
const pending = new Map(), localItems = new Map();
function putSoon(id, data) {
  S.items.set(id, { ...data, id }); localItems.set(id, { ...data, id }); render();
  clearTimeout(pending.get(id));
  pending.set(id, setTimeout(async () => { pending.delete(id); localItems.delete(id); await put("items", id, data); }, 600));
}

// ---------- helpers ----------
const boxList = () => [...S.boxes.values()].sort((a, b) => (a.number || 0) - (b.number || 0));
const itemsOf = id => [...S.items.values()].filter(i => i.boxId === id).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
const codeOf = b => "BOX " + String(b.number || 0).padStart(3, "0");
const nextNumber = () => boxList().reduce((m, b) => Math.max(m, b.number || 0), 0) + 1;
const norm = s => String(s || "").toLowerCase();
function orderHref(it) {
  if (it.link && /^https?:\/\//i.test(it.link)) return it.link;
  return "https://www.amazon.com/s?k=" + encodeURIComponent(it.search || it.name);
}
const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
function imgSrc(id) {
  if (photoData.has(id)) return photoData.get(id);
  if (!photoLoading.has(id)) {
    photoLoading.add(id);
    getDoc(doc(db, "photos", id)).then(d => {
      if (d.exists()) { photoData.set(id, d.data().data); render(); }
    }).catch(() => {}).finally(() => photoLoading.delete(id));
  }
  return BLANK;
}

// ---------- render ----------
function render() {
  if ($("#app").hidden) return;
  $("#home").hidden = S.view !== "home";
  $("#boxView").hidden = S.view !== "box";
  if (S.view === "home") renderHome(); else renderBox();
  const locs = [...new Set(boxList().map(b => b.location).filter(Boolean))];
  $("#locList").innerHTML = locs.map(l => `<option>${esc(l)}</option>`).join("");
}

function itemRow(it, showBox) {
  const b = S.boxes.get(it.boxId);
  return `<div class="item" data-item="${esc(it.id)}">
    <div>
      <div class="name">${esc(it.name)} ${it.low ? '<span class="pill low">Running low</span>' : ""}</div>
      ${it.notes ? `<div class="sub">${esc(it.notes)}</div>` : ""}
      ${showBox && b ? `<div class="sub">in <button class="boxlink" data-open="${esc(b.id)}">${esc(codeOf(b))} · ${esc(b.name)}</button>${b.location ? " — " + esc(b.location) : ""}</div>` : ""}
    </div>
    <div class="actions">
      <span class="qty"><button data-dec aria-label="Less">−</button><span>${Number(it.qty) || 0}</span><button data-inc aria-label="More">+</button></span>
      <button class="lowbtn" data-low aria-pressed="${!!it.low}">${it.low ? "Low" : "Mark low"}</button>
      <a class="order" href="${esc(orderHref(it))}" target="_blank" rel="noopener">Order more ↗</a>
      <button class="btn sm ghost" data-edit>Edit</button>
    </div>
  </div>`;
}

function renderHome() {
  const boxes = boxList(), items = [...S.items.values()];
  const low = items.filter(i => i.low);
  $("#stats").innerHTML = `<span><b>${boxes.length}</b>boxes</span><span><b>${items.reduce((s, i) => s + (Number(i.qty) || 0), 0)}</b>items counted</span><span><b>${boxes.filter(b => !itemsOf(b.id).length).length}</b>boxes not itemized yet</span>`;
  $("#chips").innerHTML = [["all", "All boxes", boxes.length], ["low", "Running low", low.length]]
    .map(([k, l, n]) => `<button class="chip" data-filter="${k}" aria-pressed="${S.filter === k}">${l}<span class="n">${n}</span></button>`).join("");
  const body = $("#homeBody");
  if (!S.ready) { body.innerHTML = `<div class="empty">Loading storage…</div>`; return; }
  const q = norm(S.q).trim();
  if (q) {
    const terms = q.split(/\s+/);
    const hit = s => terms.every(t => norm(s).includes(t));
    const ib = items.filter(i => { const b = S.boxes.get(i.boxId) || {}; return hit([i.name, i.notes, b.name, b.location, b.category].join(" ")); });
    const bb = boxes.filter(b => hit([codeOf(b), b.name, b.location, b.category, b.notes].join(" ")));
    body.innerHTML = `
      ${bb.length ? `<div class="grid" style="margin-bottom:16px">${bb.map(boxCard).join("")}</div>` : ""}
      ${ib.length ? `<div class="list">${ib.map(i => itemRow(i, true)).join("")}</div>` : ""}
      ${!bb.length && !ib.length ? `<div class="empty">Nothing matches “${esc(S.q)}”. It may be in a box that isn't itemized yet.</div>` : ""}`;
    return;
  }
  if (S.filter === "low") {
    body.innerHTML = low.length ? `<div class="list">${low.map(i => itemRow(i, true)).join("")}</div>`
      : `<div class="empty">Nothing is marked as running low. Tap “Mark low” on an item to add it to this restock list.</div>`;
    return;
  }
  body.innerHTML = boxes.length ? `<div class="grid">${boxes.map(boxCard).join("")}</div>`
    : `<div class="empty"><strong>No boxes yet.</strong>Grab the first box, write a number on it, and add it here. Or restore a backup in Settings.<button class="btn kraft" data-newbox>+ New box</button></div>`;
}

function boxCard(b) {
  const its = itemsOf(b.id), n = its.length, lowN = its.filter(i => i.low).length;
  const ph = (b.photos || [])[0];
  return `<button class="box" data-open="${esc(b.id)}">
    <div class="thumb">${ph ? `<img src="${esc(imgSrc(ph))}" alt="">` : `<span class="noimg">${esc(codeOf(b))}</span>`}</div>
    <div class="meta">
      <span class="code">${esc(codeOf(b))}</span>
      <h3>${esc(b.name || "Untitled box")}</h3>
      <div class="row">
        ${b.category ? `<span class="pill">${esc(b.category)}</span>` : ""}
        ${lowN ? `<span class="pill low">${lowN} low</span>` : ""}
      </div>
      <div class="muted">${n ? n + (n === 1 ? " item" : " items") : "Not itemized yet"}${b.location ? " · " + esc(b.location) : ""}</div>
    </div>
  </button>`;
}

function renderBox() {
  const b = S.boxes.get(S.boxId);
  if (!b) { S.view = "home"; render(); return; }
  $("#boxHead").innerHTML = `
    <div>
      <div class="bigcode">${esc(codeOf(b))}</div>
      <h2>${esc(b.name || "Untitled box")}</h2>
      <div class="row" style="margin-top:6px">
        ${b.category ? `<span class="pill">${esc(b.category)}</span>` : ""}
        ${b.location ? `<span class="muted">Location: ${esc(b.location)}</span>` : '<span class="muted">No location set</span>'}
      </div>
      ${b.notes ? `<p class="desc">${esc(b.notes)}</p>` : ""}
    </div>
    <div class="row"><button class="btn" id="editBoxBtn">Edit box</button></div>`;
  const photos = b.photos || [];
  $("#photos").innerHTML = photos.length
    ? photos.map(id => `<div class="ph"><img src="${esc(imgSrc(id))}" alt="Box contents photo" data-view="${esc(id)}"><button class="x" data-rmphoto="${esc(id)}">Remove</button></div>`).join("")
    : `<div class="muted">No photos yet. Open the box, take a picture of what's inside, and add it here.</div>`;
  const its = itemsOf(b.id);
  $("#itemsTitle").textContent = `Items · ${its.length}`;
  $("#items").innerHTML = its.length ? `<div class="list">${its.map(i => itemRow(i, false)).join("")}</div>`
    : `<div class="muted">No items listed yet. Add them one by one above.</div>`;
}

function go(view, boxId) { S.view = view; S.boxId = boxId || null; render(); window.scrollTo(0, 0); }

// ---------- sheets ----------
function openSheet(html, onMount) {
  const o = $("#overlay"); o.innerHTML = html; o.hidden = false;
  onMount && onMount(o);
  const f = o.querySelector("input:not([type=file]),textarea"); f && f.focus();
}
function closeSheet() { const o = $("#overlay"); o.hidden = true; o.innerHTML = ""; }
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay" || e.target.closest("[data-close]")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#overlay").hidden) closeSheet(); });

function armed(btn, label, fn) {
  if (btn.classList.contains("armed")) { fn(); return; }
  btn.classList.add("armed"); const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = old; } }, 3500);
}

function boxSheet(b) {
  const isNew = !b; b = b || { number: nextNumber() };
  openSheet(`<form class="sheet" id="boxForm" autocomplete="off">
    <h2>${isNew ? "New box" : "Edit " + esc(codeOf(b))}</h2>
    <div class="two">
      <div class="field"><label for="bNum">Box number</label><input id="bNum" type="number" min="1" value="${esc(b.number)}" required><span class="hint">Write this on the box with a marker.</span></div>
      <div class="field"><label for="bCat">Ministry / category</label><input id="bCat" list="catList" value="${esc(b.category)}" placeholder="Christmas"></div>
    </div>
    <div class="field"><label for="bName">What's in it (short name)</label><input id="bName" value="${esc(b.name)}" placeholder="Nativity set and tree lights" required></div>
    <div class="field"><label for="bLoc">Where it lives</label><input id="bLoc" list="locList" value="${esc(b.location)}" placeholder="Storage room, Shelf B, top"></div>
    <div class="field"><label for="bNotes">Notes</label><textarea id="bNotes" rows="2" placeholder="Fragile, heavy, belongs to Women's ministry…">${esc(b.notes)}</textarea></div>
    <div class="foot">
      <div>${isNew ? "" : `<button type="button" class="btn danger" id="delBox">Delete box</button>`}</div>
      <div class="row"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">${isNew ? "Create box" : "Save"}</button></div>
    </div>
  </form>`, o => {
    o.querySelector("#boxForm").addEventListener("submit", e => {
      e.preventDefault();
      const id = isNew ? uid() : b.id;
      const data = { ...(isNew ? { photos: [], createdAt: Date.now(), createdBy: S.me } : strip(b)),
        number: Math.max(1, parseInt($("#bNum").value, 10) || 1), name: $("#bName").value.trim(),
        category: $("#bCat").value.trim(), location: $("#bLoc").value.trim(), notes: $("#bNotes").value.trim(),
        updatedAt: Date.now(), updatedBy: S.me };
      const clash = boxList().find(x => x.number === data.number && x.id !== id);
      if (clash) { toast(`${codeOf(clash)} already exists. Pick another number.`); return; }
      put("boxes", id, data); closeSheet();
      if (isNew) go("box", id); else toast("Saved");
    });
    const d = o.querySelector("#delBox");
    d && d.addEventListener("click", () => armed(d, "Tap again to delete box and its items", async () => {
      const its = itemsOf(b.id);
      closeSheet(); go("home");
      for (const it of its) await del("items", it.id);
      for (const p of b.photos || []) deleteDoc(doc(db, "photos", p)).catch(() => {});
      await del("boxes", b.id);
      toast("Box deleted");
    }));
  });
}

function itemSheet(it) {
  openSheet(`<form class="sheet" id="itemForm" autocomplete="off">
    <h2>Edit item</h2>
    <div class="field"><label for="iName">Name</label><input id="iName" value="${esc(it.name)}" required></div>
    <div class="two">
      <div class="field"><label for="iQty">Quantity</label><input id="iQty" type="number" min="0" value="${esc(it.qty)}"></div>
      <div class="field"><label for="iBox">Box</label><select id="iBox">${boxList().map(b => `<option value="${esc(b.id)}" ${b.id === it.boxId ? "selected" : ""}>${esc(codeOf(b))} · ${esc(b.name)}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="iNotes">Notes</label><input id="iNotes" value="${esc(it.notes)}" placeholder="Color, size, condition"></div>
    <div class="field"><label for="iLink">Order link</label><input id="iLink" value="${esc(it.link)}" placeholder="https://…"><span class="hint">Paste the exact product page. Left blank, “Order more” searches Amazon for the item name.</span></div>
    <label class="row" style="font-size:14px"><input type="checkbox" id="iLow" ${it.low ? "checked" : ""}> Running low, add to restock list</label>
    <div class="foot">
      <button type="button" class="btn danger" id="delItem">Delete item</button>
      <div class="row"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button></div>
    </div>
  </form>`, o => {
    o.querySelector("#itemForm").addEventListener("submit", e => {
      e.preventDefault();
      put("items", it.id, { ...strip(it), name: $("#iName").value.trim(), qty: Math.max(0, parseInt($("#iQty").value, 10) || 0),
        boxId: $("#iBox").value, notes: $("#iNotes").value.trim(), link: $("#iLink").value.trim(), low: $("#iLow").checked,
        updatedAt: Date.now(), updatedBy: S.me });
      closeSheet(); toast("Saved");
    });
    const d = o.querySelector("#delItem");
    d.addEventListener("click", () => armed(d, "Tap again to delete", () => { del("items", it.id); closeSheet(); toast("Item deleted"); }));
  });
}

// ---------- settings: name, backup ----------
async function settingsSheet() {
  openSheet(`<div class="sheet">
    <h2>Settings</h2>
    <div class="field"><label for="sName">Your name on this device (optional)</label><input id="sName" value="${esc(S.me)}"><span class="hint">Shown as who last changed a box or item. Leave as WGBC if you like.</span></div>
    <div class="field"><label>Backup</label>
      <div class="row">
        <button class="btn" id="exportBtn">Download backup</button>
        <label class="btn">Restore backup<input type="file" id="importInput" accept=".json,application/json" hidden></label>
      </div>
      <span class="hint">Download a backup every month or so. It saves every box, item and photo in one file. Restoring puts a backup's boxes back and overwrites boxes with the same ID.</span>
    </div>
    <div class="foot"><button class="btn danger" id="forgetBtn">Log out this device</button><button class="btn primary" id="doneBtn">Done</button></div>
  </div>`, o => {
    o.querySelector("#exportBtn").onclick = exportBackup;
    o.querySelector("#importInput").addEventListener("change", importBackup);
    o.querySelector("#doneBtn").onclick = async () => {
      const n = $("#sName").value.trim();
      if (n && n !== S.me) {
        try { await setDoc(doc(db, "members", myUid), { name: n }, { merge: true }); S.me = n; try { localStorage.setItem("storit-name", n); } catch {} toast("Saved"); }
        catch (err) { toast(errMsg(err)); }
      }
      closeSheet();
    };
    const f = o.querySelector("#forgetBtn");
    f.onclick = () => armed(f, "Tap again: you'll need the login and code to get back in", async () => {
      closeSheet();
      try { await deleteDoc(doc(db, "members", myUid)); } catch {}
      signOut(auth);
    });
  });
}
async function exportBackup() {
  toast("Preparing backup…");
  try {
    const photos = {};
    for (const b of S.boxes.values()) for (const p of b.photos || []) {
      const d = await getDoc(doc(db, "photos", p)); if (d.exists()) photos[p] = d.data();
    }
    const data = { app: "WGBC Storit", version: 1, exportedAt: new Date().toISOString(),
      boxes: [...S.boxes.values()], items: [...S.items.values()], photos };
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `storit-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { toast(errMsg(e)); }
}
async function importBackup(e) {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch { toast("That file isn't a Storit backup."); return; }
  if (!Array.isArray(data.boxes) || !Array.isArray(data.items)) { toast("That file isn't a Storit backup."); return; }
  toast("Restoring…");
  try {
    const writes = [];
    for (const b of data.boxes) writes.push(["boxes", b.id, strip(b)]);
    for (const i of data.items) writes.push(["items", i.id, strip(i)]);
    for (const [id, p] of Object.entries(data.photos || {})) writes.push(["photos", id, p]);
    // photos are large: commit in small batches
    for (let k = 0; k < writes.length;) {
      const batch = writeBatch(db); let bytes = 0, n = 0;
      while (k < writes.length && n < 400 && bytes < 8e6) {
        const [c, id, d] = writes[k++]; batch.set(doc(db, c, id), d); bytes += JSON.stringify(d).length; n++;
      }
      await batch.commit();
    }
    toast(`Restored ${data.boxes.length} box${data.boxes.length === 1 ? "" : "es"} and ${data.items.length} item${data.items.length === 1 ? "" : "s"}`); closeSheet();
  } catch (err) { toast(errMsg(err)); }
}

// ---------- events ----------
$("#newBoxBtn").onclick = () => boxSheet(null);
$("#settingsBtn").onclick = settingsSheet;
$("#backBtn").onclick = () => go("home");
$("#q").addEventListener("input", e => { S.q = e.target.value; renderHome(); });

document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("#overlay .sheet")) return;
  const open = t.closest("[data-open]"); if (open) { go("box", open.dataset.open); return; }
  if (t.closest("[data-newbox]")) { boxSheet(null); return; }
  const f = t.closest("[data-filter]"); if (f) { S.filter = f.dataset.filter; S.q = ""; $("#q").value = ""; renderHome(); return; }
  if (t.closest("#editBoxBtn")) { boxSheet(S.boxes.get(S.boxId)); return; }
  const v = t.closest("[data-view]"); if (v) { openSheet(`<div class="sheet viewer"><img src="${esc(imgSrc(v.dataset.view))}" alt="Box contents photo"></div>`); return; }
  const rm = t.closest("[data-rmphoto]"); if (rm) { armed(rm, "Confirm", () => removePhoto(rm.dataset.rmphoto)); return; }
  const row = t.closest("[data-item]"); if (!row) return;
  const it = S.items.get(row.dataset.item); if (!it) return;
  if (t.closest("[data-inc]")) putSoon(it.id, { ...strip(it), qty: (Number(it.qty) || 0) + 1, updatedAt: Date.now(), updatedBy: S.me });
  else if (t.closest("[data-dec]")) putSoon(it.id, { ...strip(it), qty: Math.max(0, (Number(it.qty) || 0) - 1), updatedAt: Date.now(), updatedBy: S.me });
  else if (t.closest("[data-low]")) put("items", it.id, { ...strip(it), low: !it.low, updatedAt: Date.now(), updatedBy: S.me });
  else if (t.closest("[data-edit]")) itemSheet(it);
});

$("#addItemForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("#newName").value.trim(); if (!name) return;
  put("items", uid(), { boxId: S.boxId, name, qty: Math.max(0, parseInt($("#newQty").value, 10) || 1), link: $("#newLink").value.trim(),
    notes: "", low: false, createdAt: Date.now(), updatedAt: Date.now(), createdBy: S.me, updatedBy: S.me });
  $("#newName").value = ""; $("#newQty").value = 1; $("#newLink").value = ""; $("#newName").focus();
});

// ---------- photos (stored in Firestore as small JPEGs: no paid storage plan needed) ----------
function shrink(file, max, quality) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}
async function smallPhoto(file) {
  for (const [max, q] of [[1280, 0.72], [1024, 0.65], [800, 0.6]]) {
    const d = await shrink(file, max, q); if (d.length < 700000) return d;
  }
  return shrink(file, 640, 0.55);
}
$("#photoInput").addEventListener("change", async e => {
  const files = [...e.target.files]; e.target.value = "";
  const boxId = S.boxId; if (!files.length || !boxId) return;
  toast(files.length > 1 ? `Uploading ${files.length} photos…` : "Uploading photo…");
  for (const f of files) {
    let dataUrl; try { dataUrl = await smallPhoto(f); } catch { toast("That file isn't a photo we can read."); continue; }
    const id = uid();
    photoData.set(id, dataUrl);
    try { await setDoc(doc(db, "photos", id), { data: dataUrl, boxId, createdAt: Date.now(), createdBy: S.me }); }
    catch (err) { toast(errMsg(err)); continue; }
    const b = S.boxes.get(boxId); if (!b) return;
    await put("boxes", boxId, { ...strip(b), photos: [...(b.photos || []), id], updatedAt: Date.now(), updatedBy: S.me });
  }
  toast("Photo added");
});
async function removePhoto(pid) {
  const b = S.boxes.get(S.boxId); if (!b) return;
  await put("boxes", b.id, { ...strip(b), photos: (b.photos || []).filter(x => x !== pid), updatedAt: Date.now(), updatedBy: S.me });
  deleteDoc(doc(db, "photos", pid)).catch(() => {});
}
